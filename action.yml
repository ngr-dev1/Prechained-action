name: 'Prechained Supply Chain Verify'
description: 'Detect tampered dependencies by comparing your lockfile hashes against the Bitcoin-anchored Prechained archive. Fails the build on mismatch.'
author: 'NextGenRails™'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  ecosystem:
    description: 'Package ecosystem. Tamper detection currently supports: npm'
    required: false
    default: 'npm'
  manifest:
    description: 'Path to the lockfile (package-lock.json). Auto-detected if omitted.'
    required: false
    default: ''
  fail-on-mismatch:
    description: 'Fail the build if any artifact hash does not match the anchored record (tamper). Default true — this is the point of the gate.'
    required: false
    default: 'true'
  fail-on-missing:
    description: 'Also fail if a package is not yet in the archive. Default false.'
    required: false
    default: 'false'
  api-url:
    description: 'Prechained API base URL'
    required: false
    default: 'https://prechained.com/.netlify/functions/api'

outputs:
  verified-count:
    description: 'Packages whose hash matches the Bitcoin-anchored record'
  mismatch-count:
    description: 'Packages whose hash does NOT match (tamper detected)'
  coverage-percent:
    description: 'Percent of resolved packages that had an anchored hash to compare against'
  missing-count:
    description: 'Packages not yet in the archive'
  report:
    description: 'Full JSON verification report'

runs:
  using: 'node24'
  main: 'dist/index.js'
